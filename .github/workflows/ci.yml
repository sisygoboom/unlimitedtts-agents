name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: mkdir -p artifacts
      - run: pnpm --filter @unlimitedtts/core pack --pack-destination ../../artifacts
      - run: pnpm --filter @unlimitedtts/mcp pack --pack-destination ../../artifacts
      - run: pnpm --filter @unlimitedtts/wallet-adapters pack --pack-destination ../../artifacts
      - run: pnpm --filter @unlimitedtts/openclaw pack --pack-destination ../../artifacts
